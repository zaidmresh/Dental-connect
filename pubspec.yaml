name: dentel_connect
description: 'Dental Connect is a digital platform designed to connect patients with dental professionals, making dental care more accessible and convenient.'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  intl: ^0.20.2
  uuid: ^4.5.3
  cloud_firestore: ^6.3.0
  firebase_core: ^4.7.0
  file_picker: ^11.0.2
  firebase_storage: ^13.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpeg
